    <style>
    /* Critical styles for initial render */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Borel', cursive, system-ui, -apple-system, sans-serif;
        background-color: #ffffff;
        color: #1a1a1a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        line-height: 1.6;
        transition: background-color 0.3s ease, color 0.3s ease;
    }
    .site-header {
        padding: 60px 20px;
        text-align: center;
        background: linear-gradient(180deg, #ffffff 0%, #f8f8f8 100%);
        border-bottom: 1px solid #e0e0e0;
        position: relative;
    }
    .site-title {
        font-family: 'Borel', cursive, system-ui, -apple-system, sans-serif;
        font-size: 2.8rem;
        font-weight: 400;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
        color: #1a1a1a;
        min-height: 1.2em;
        line-height: 1.2;
    }
    .site-subtitle {
        font-size: 0.95rem;
        color: #666666;
        font-weight: 300;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        min-height: 1.4em;
        line-height: 1.4;
    }
    .gallery-container {
        flex: 1;
        padding: 40px 20px;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
        contain: layout style;
    }
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 25px;
        min-height: 200px;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .gallery-grid.rendered {
        opacity: 1;
        transform: translateY(0);
    }
    .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        cursor: pointer;
        background-color: #f5f5f5;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        aspect-ratio: 3/2;
        border: 1px solid #e0e0e0;
        will-change: transform, box-shadow;
        contain: layout;
    }
    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
        background-color: #f5f5f5;
        display: block;
    }
    .gallery-item-placeholder {
        width: 100%;
        height: 100%;
        background-color: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .lightbox {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.95);
        z-index: 1000;
        animation: fadeIn 0.3s ease;
        will-change: opacity, transform;
        contain: layout;
    }
    .lightbox.active { display: flex; justify-content: center; align-items: center; }
    .lightbox-image { max-width: 90%; max-height: 85vh; object-fit: contain; }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @media (max-width: 768px) {
        .site-title { font-size: 2.5rem; }
        .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    }
    @media (max-width: 480px) {
        .site-title { font-size: 2rem; }
        .gallery-grid { grid-template-columns: 1fr; }
        .lightbox-image { max-width: 95%; max-height: 70vh; }
    }
    </style>

    <!-- Service Worker Registration -->
    <script>
    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('✅ Service Worker registered:', registration.scope);

                    // Handle updates
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        if (newWorker) {
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New version available
                                    if (confirm('새 버전이 있습니다. 새로고침하시겠습니까?')) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                        window.location.reload();
                                    }
                                }
                            });
                        }
                    });
                })
                .catch(error => {
                    console.warn('❌ Service Worker registration failed:', error);
                });
        });
    }
    </script>
